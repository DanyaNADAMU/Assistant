[project]
name = "summary-bot"
version = "0.1.0"
description = "Multimodal Telegram Bot & CLI for universal media summarization, speech-to-text, and synthesis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NADAMU", email = "git@nada.mu" },
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "aiogram>=3.15.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "trafilatura>=2.0.0",
    "aiofiles>=24.1.0",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
tts = [
    "edge-tts>=6.1.19",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "types-aiofiles>=24.1.0",
]

[project.scripts]
summary-bot = "summary_bot.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summary_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "docx.*",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
