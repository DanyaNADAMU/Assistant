name: Build and Deploy SummaryBot

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Containerfile"
      - "SummaryBot*.container"
      - ".forgejo/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment Target"
        required: true
        default: "test"
        type: choice
        options:
          - "test"
          - "actions"
          - "both"

env:
  REGISTRY: git.nada.mu
  IMAGE_NAME: git.nada.mu/nadamu/summary-bot:latest
  IMAGE_TAGGED: git.nada.mu/nadamu/summary-bot:${{ github.sha }}

jobs:
  build:
    name: Build & Push Container Image
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Registry Credentials for Kaniko
        run: |
          mkdir -p "${{ github.workspace }}/.docker"
          REGISTRY_PASS="${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}"
          AUTH=$(printf '%s:%s' "DanyaNADAMU" "${REGISTRY_PASS}" | base64 | tr -d '\n')
          cat <<EOF > "${{ github.workspace }}/.docker/config.json"
          {
            "auths": {
              "${{ env.REGISTRY }}": {
                "auth": "${AUTH}"
              },
              "https://${{ env.REGISTRY }}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF

      - name: Build and Push Image via Kaniko
        uses: docker://gcr.io/kaniko-project/executor:debug
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Containerfile
            --destination=${{ env.IMAGE_NAME }}
            --destination=${{ env.IMAGE_TAGGED }}

      - name: Cleanup Registry Credentials
        if: always()
        run: rm -rf "${{ github.workspace }}/.docker"

  deploy-test:
    name: Deploy to Staging (Test)
    needs: build
    runs-on: docker
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'test' || github.event.inputs.target == 'both')) ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Rootless Podman Quadlet
        uses: ./.forgejo/actions/deploy-quadlet
        with:
          host: ${{ secrets.TEST_HOST || '81.30.105.65' }}
          port: ${{ secrets.TEST_PORT || '4021' }}
          user: ${{ secrets.TEST_USER || 'apps' }}
          key: ${{ secrets.TEST_SSH_KEY }}
          service_name: "SummaryBot"
          image: ${{ env.IMAGE_NAME }}
          registry_url: ${{ env.REGISTRY }}
          registry_user: "DanyaNADAMU"
          registry_password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          env_content: ${{ secrets.TEST_ENV }}
          quadlet_file: "SummaryBot.test.container"

  deploy-actions:
    name: Deploy to Actions Sandbox
    needs: build
    runs-on: docker
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'actions' || github.event.inputs.target == 'both')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Rootless Podman Quadlet
        uses: ./.forgejo/actions/deploy-quadlet
        with:
          host: ${{ secrets.ACTIONS_HOST || 'actions.nada.mu' }}
          port: ${{ secrets.ACTIONS_PORT || '22' }}
          user: ${{ secrets.ACTIONS_USER || 'actions' }}
          key: ${{ secrets.ACTIONS_SSH_KEY }}
          service_name: "SummaryBot"
          image: ${{ env.IMAGE_NAME }}
          registry_url: ${{ env.REGISTRY }}
          registry_user: "DanyaNADAMU"
          registry_password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          env_content: ${{ secrets.SUMMARYBOT_ENV }}
          quadlet_file: "SummaryBot.container"
