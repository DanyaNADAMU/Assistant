name: Deployed Image Re-scan

# Caller stub: the drift detector lives in the shared catalog. Re-scans
# the deployed digests daily: the build-time Trivy gate covers each image
# exactly once, at build; a CVE published after the release must surface
# as a red run (patch-release signal), not wait for the next tag.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescan:
    uses: Danyanadamu/Workflows/.github/workflows/scan-cron.yml@610aef6471d71530319af39c4c26035c4a748b05
    with:
      # The staging sandbox tracks per-branch sha tags that churn too fast
      # to be meaningful drift subjects; the production :latest pointer is
      # what actually runs on Ice and what this scan pins down.
      images: ghcr.io/danyanadamu/assistant:latest
