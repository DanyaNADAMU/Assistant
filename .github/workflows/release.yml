name: Release Assistant

# Production pipeline: signed semver tags build the release image and roll
# it out to the production contour (Ice). Tag push is the only trigger:
# production deploys never ride on plain commits to main. The release gate
# (release-precheck) and the test suite both run before the release image
# is built, so an unverified or untested tag never ships.
on:
  push:
    tags:
      - 'v*'

jobs:
  precheck:
    # Shared gate: strict SemVer, CHANGELOG section, SSH tag-signature
    # verification against .allowed_signers, ancestry from main.
    uses: Danyanadamu/Workflows/.github/workflows/release-precheck.yml@v1
    with:
      base_branch: main

  test:
    needs: precheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test suite (ruff, mypy strict, pytest)
        uses: ./.github/actions/test

  build:
    needs: test
    # Single canonical build path from the shared catalog.
    permissions:
      contents: read
      packages: write
    uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@v1
    with:
      context: .
      file: ./Containerfile
      image_tag: ${{ github.ref_name }}
      extra_tags: latest

  deploy:
    needs: build
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.PROD_HOST }}
      port: ${{ vars.PROD_PORT }}
      user: apps
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.PROD_DEPLOY_KEY }}
      host_key: ${{ secrets.PROD_DEPLOY_HOST_KEY }}
