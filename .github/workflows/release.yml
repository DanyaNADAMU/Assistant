name: Release Assistant

# Production pipeline: signed semver tags build the release image and roll
# it out to the production contour (Ice). Tag push is the only trigger:
# production deploys never ride on plain commits to main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Verify release tag in CHANGELOG
        # Every production release must document its section; an
        # undocumented tag halts the pipeline before anything ships.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          grep -Fq "## [$tag]" CHANGELOG.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Record pushed image ref
        id: image
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.PROD_HOST }}
      port: ${{ vars.PROD_PORT }}
      user: apps
      image: ${{ needs.release.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.PROD_DEPLOY_KEY }}
      host_key: ${{ secrets.PROD_DEPLOY_HOST_KEY }}
