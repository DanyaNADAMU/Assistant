name: Build & Test Deploy

# Trunk pipeline: every push to main or a feature branch runs the test
# suite, builds the container image through the shared catalog, and, on
# feature branches only, rolls it out to the test sandbox (Actions).
# Production releases run from release.yml on signed tags.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Same-branch pushes supersede each other: the newest ref wins and
  # stale test-suite runs are cancelled before they finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test suite (ruff, mypy strict, pytest)
        uses: ./.github/actions/test

  build:
    needs: test
    # Single canonical build path from the shared catalog: lowercase GHCR
    # name, layer cache, provenance + SBOM, Trivy severity gate.
    permissions:
      contents: read
      packages: write
      # id-token + attestations: the catalog's provenance attestation step
      # signs via the runner's OIDC identity; without these grants it
      # fails closed, which is the correct default for a missing grant.
      id-token: write
      attestations: write
    uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@66ed97351f7ef8ab4e2b8dd0d3adda654b939021
    with:
      context: .
      file: ./Containerfile
      image_tag: ${{ github.sha }}
      # PR builds are verification-only: no push, so a draft PR can
      # never move the tags the staging testbed pins.
      push: ${{ github.event_name != 'pull_request' }}

  test-deploy:
    needs: build
    # Feature/fix branches deploy to the test sandbox (Actions LXC) for
    # validation; main is released to production via tags in release.yml.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@66ed97351f7ef8ab4e2b8dd0d3adda654b939021
    with:
      host: ${{ vars.TEST_HOST }}
      port: ${{ vars.TEST_PORT }}
      user: apps
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.TEST_DEPLOY_KEY }}
      host_key: ${{ secrets.TEST_DEPLOY_HOST_KEY }}
