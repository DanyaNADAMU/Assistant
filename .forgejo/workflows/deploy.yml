name: Build and Deploy SummaryBot

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Containerfile"
      - "SummaryBot.container"
      - ".forgejo/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: git.nada.mu
  IMAGE_NAME: git.nada.mu/${{ github.repository }}:latest
  IMAGE_TAGGED: git.nada.mu/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    name: Build & Push Container Image
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Registry Credentials for Kaniko
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          cat <<EOF > ~/.docker/config.json
          {
            "auths": {
              "https://${{ env.REGISTRY }}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF

      - name: Build and Push Image via Kaniko
        uses: docker://gcr.io/kaniko-project/executor:debug
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Containerfile
            --destination=${{ env.IMAGE_NAME }}
            --destination=${{ env.IMAGE_TAGGED }}
            --cache=true

  deploy:
    name: Deploy to Actions Sandbox
    needs: build
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Rootless Podman Quadlet
        uses: ./.forgejo/actions/deploy-quadlet
        with:
          host: ${{ secrets.ACTIONS_HOST || 'actions.nada.mu' }}
          port: "22"
          user: "actions"
          key: ${{ secrets.ACTIONS_SSH_KEY }}
          service_name: "SummaryBot"
          image: ${{ env.IMAGE_NAME }}
          registry_url: ${{ env.REGISTRY }}
          registry_user: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          env_content: ${{ secrets.SUMMARYBOT_ENV }}
          quadlet_file: "SummaryBot.container"
