name: "Deploy Podman Quadlet"
description: "Deploy and manage rootless Podman Quadlet container services over SSH"
author: "NADAMU"

inputs:
  host:
    description: "Target SSH host or IP"
    required: true
  port:
    description: "Target SSH port"
    required: false
    default: "22"
  user:
    description: "Target SSH user"
    required: false
    default: "actions"
  key:
    description: "Private SSH key for authentication"
    required: true
  service_name:
    description: "Systemd service and container name"
    required: false
    default: "SummaryBot"
  image:
    description: "Full container image tag to pull and run"
    required: true
  registry_url:
    description: "Container registry URL for podman login"
    required: false
    default: "git.nada.mu"
  registry_user:
    description: "Container registry username"
    required: false
  registry_password:
    description: "Container registry password / token"
    required: false
  env_content:
    description: "Raw contents to write into stack .env file"
    required: false
  quadlet_file:
    description: "Path to .container Quadlet file in repository"
    required: false
    default: "SummaryBot.container"

runs:
  using: "composite"
  steps:
    - name: Deploy Quadlet Service via SSH
      shell: bash
      run: |
        set -euo pipefail

        echo "==> Preparing temporary deployment credentials..."
        SSH_DIR="$(mktemp -d)"
        KEY_FILE="$SSH_DIR/id_deploy"
        trap 'rm -rf "$SSH_DIR"' EXIT

        printf '%s\n' "${{ inputs.key }}" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"

        SSH_OPTS="-4 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=15 -p ${{ inputs.port }} -i $KEY_FILE"
        SCP_OPTS="-4 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=15 -P ${{ inputs.port }} -i $KEY_FILE"
        SSH_TARGET="${{ inputs.user }}@${{ inputs.host }}"

        echo "==> Testing SSH connection to ${SSH_TARGET}..."
        ssh $SSH_OPTS "$SSH_TARGET" "echo 'Connected successfully as user: \$(whoami)'"

        # 1. Authenticate with container registry if credentials are provided
        if [ -n "${{ inputs.registry_user }}" ] && [ -n "${{ inputs.registry_password }}" ]; then
          echo "==> Authenticating Podman with registry ${{ inputs.registry_url }}..."
          printf '%s\n' "${{ inputs.registry_password }}" | ssh $SSH_OPTS "$SSH_TARGET" "podman login ${{ inputs.registry_url }} --username '${{ inputs.registry_user }}' --password-stdin || true"
        fi

        # 2. Pull latest container image
        echo "==> Pulling container image: ${{ inputs.image }}..."
        ssh $SSH_OPTS "$SSH_TARGET" "podman pull ${{ inputs.image }}"

        # 3. Ensure target stack and Quadlet directories exist
        echo "==> Ensuring target directories exist..."
        ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p ~/stacks/${{ inputs.service_name }} ~/.config/containers/systemd"

        # 4. Deploy environment file if provided
        if [ -n "${{ inputs.env_content }}" ]; then
          echo "==> Updating ~/stacks/${{ inputs.service_name }}/.env..."
          printf '%s\n' "${{ inputs.env_content }}" | ssh $SSH_OPTS "$SSH_TARGET" "cat > ~/stacks/${{ inputs.service_name }}/.env && chmod 600 ~/stacks/${{ inputs.service_name }}/.env"
        fi

        # 5. Deploy Quadlet container definition
        echo "==> Deploying Quadlet file to ~/.config/containers/systemd/${{ inputs.service_name }}.container..."
        QUADLET_PATH="${GITHUB_WORKSPACE:-.}/${{ inputs.quadlet_file }}"
        scp $SCP_OPTS "$QUADLET_PATH" "${SSH_TARGET}:~/.config/containers/systemd/${{ inputs.service_name }}.container"

        # 6. Reload user systemd daemon and restart service
        echo "==> Reloading systemd user daemon and restarting ${{ inputs.service_name }}.service..."
        ssh $SSH_OPTS "$SSH_TARGET" "systemctl --user daemon-reload && systemctl --user restart ${{ inputs.service_name }}.service"

        # 7. Check service health
        echo "==> Verifying service health..."
        sleep 3
        if ssh $SSH_OPTS "$SSH_TARGET" "systemctl --user is-active --quiet ${{ inputs.service_name }}.service"; then
          echo "==> SUCCESS: ${{ inputs.service_name }}.service is ACTIVE and RUNNING!"
          ssh $SSH_OPTS "$SSH_TARGET" "systemctl --user status ${{ inputs.service_name }}.service --no-pager"
        else
          echo "==> ERROR: ${{ inputs.service_name }}.service failed to start!"
          ssh $SSH_OPTS "$SSH_TARGET" "systemctl --user status ${{ inputs.service_name }}.service --no-pager" || true
          ssh $SSH_OPTS "$SSH_TARGET" "journalctl --user -u ${{ inputs.service_name }}.service -n 50 --no-pager" || true
          exit 1
        fi

        echo "==> Deployment finished successfully."
